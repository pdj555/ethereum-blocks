name: Configure AI credentials
description: Select one optional AI provider without persisting credentials.

inputs:
  claude_code_oauth_token:
    description: Primary Claude Code OAuth token
    required: false
    default: ""
  ollama_api_key:
    description: Fallback Ollama Cloud API key
    required: false
    default: ""
  anthropic_api_key:
    description: Fallback Anthropic API key
    required: false
    default: ""

outputs:
  provider:
    description: Selected auth provider, or none when no credentials are configured
    value: ${{ steps.select.outputs.provider }}
  model:
    description: Model supported by the selected provider
    value: ${{ steps.select.outputs.model }}
  base_url:
    description: Anthropic-compatible endpoint for the selected provider
    value: ${{ steps.select.outputs.base_url }}

runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        HAS_OAUTH: ${{ inputs.claude_code_oauth_token != '' }}
        HAS_OLLAMA: ${{ inputs.ollama_api_key != '' }}
        HAS_ANTHROPIC: ${{ inputs.anthropic_api_key != '' }}
      run: |
        set -euo pipefail

        provider=none
        model=
        base_url=
        if [ "$HAS_OAUTH" = "true" ]; then
          provider=claude-oauth
          model=opus
          base_url=https://api.anthropic.com
        elif [ "$HAS_OLLAMA" = "true" ]; then
          provider=ollama-cloud
          model=glm-5.2:cloud
          base_url=https://ollama.com
        elif [ "$HAS_ANTHROPIC" = "true" ]; then
          provider=anthropic-api
          model=opus
          base_url=https://api.anthropic.com
        fi

        {
          echo "provider=$provider"
          echo "model=$model"
          echo "base_url=$base_url"
        } >> "$GITHUB_OUTPUT"

        if [ "$provider" = "none" ]; then
          echo "::notice::AI automation skipped: no supported AI credential is configured."
          {
            echo "### AI automation skipped"
            echo ""
            echo 'Configure one repository secret: CLAUDE_CODE_OAUTH_TOKEN, OLLAMA_API_KEY, or ANTHROPIC_API_KEY.'
            echo "No AI assistant, review, triage, or audit was performed. Product verification runs separately."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
