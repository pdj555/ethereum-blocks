name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-assistant-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude responds
    if: |
      (
        (
          github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        )
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AI credentials
        id: ai
        uses: ./.github/actions/configure-ai
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude
        if: steps.ai.outputs.provider != 'none'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai.outputs.base_url }}
          # The action explicitly forwards custom headers to the Claude subprocess.
          # Ollama requires Bearer auth and does not accept x-api-key alone.
          ANTHROPIC_CUSTOM_HEADERS: "${{ steps.ai.outputs.provider == 'ollama-cloud' && format('Authorization: Bearer {0}', secrets.OLLAMA_API_KEY) || '' }}"
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
        with:
          claude_code_oauth_token: ${{ steps.ai.outputs.provider == 'claude-oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Ollama's key also satisfies the action's required API-key input.
          anthropic_api_key: ${{ (steps.ai.outputs.provider == 'ollama-cloud' && secrets.OLLAMA_API_KEY) || (steps.ai.outputs.provider == 'anthropic-api' && secrets.ANTHROPIC_API_KEY) || '' }}
          trigger_phrase: "@claude"
          prompt: |
            You are the revenue engineer for the Ethereum Block Explorer.
            Never log, echo, or commit secrets.

            Operating principles:
            1. Profit is the only success metric.
            2. Ship, do not discuss.
            3. Bias toward the smallest change that unlocks the biggest upside.
            4. Treat broken CI as a revenue leak.
            5. Be direct and professional.

            Respond to the latest @claude request in this thread now.
          claude_args: |
            --model ${{ steps.ai.outputs.model }}
            --max-turns 15
            --allowedTools Read,Edit,Write,Bash,Grep,Glob
