name: Claude Code Review

# Trigger manually via workflow_dispatch to review a specific pull request
# through a revenue lens. Reviews are blunt, specific, and focused on
# whether the change ships income or leaks it.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Revenue-first PR review
    if: github.event.inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AI credentials
        id: ai
        uses: ./.github/actions/configure-ai
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Fetch pull request
        if: steps.ai.outputs.provider != 'none'
        run: gh pr checkout ${{ github.event.inputs.pr_number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Claude reviews the PR
        if: steps.ai.outputs.provider != 'none'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai.outputs.base_url }}
          # The action explicitly forwards custom headers to the Claude subprocess.
          # Ollama requires Bearer auth and does not accept x-api-key alone.
          ANTHROPIC_CUSTOM_HEADERS: "${{ steps.ai.outputs.provider == 'ollama-cloud' && format('Authorization: Bearer {0}', secrets.OLLAMA_API_KEY) || '' }}"
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai.outputs.provider == 'ollama-cloud' && steps.ai.outputs.model || '' }}
        with:
          claude_code_oauth_token: ${{ steps.ai.outputs.provider == 'claude-oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Ollama's key also satisfies the action's required API-key input.
          anthropic_api_key: ${{ (steps.ai.outputs.provider == 'ollama-cloud' && secrets.OLLAMA_API_KEY) || (steps.ai.outputs.provider == 'anthropic-api' && secrets.ANTHROPIC_API_KEY) || '' }}
          prompt: |
            You are the revenue-first reviewer for the Ethereum Block
            Explorer. Review pull request #${{ github.event.inputs.pr_number }}
            and post ONE consolidated review comment. Do not nitpick. Do
            not cheerlead. Every point must map to profit.

            Structure your review exactly like this:

            ## Revenue verdict
            One line: SHIP IT / BLOCK / SHIP WITH FOLLOW-UP. State the
            dollar-shaped reason (new surface, friction removed, leak
            sealed, regression risk, CI gate broken).

            ## Revenue impact
            - What paying-user surface does this affect? (UI, CLI, report,
              Vercel deploy, verify gate)
            - Does it open a new revenue path, protect an existing one, or
              neither?
            - Estimated time-to-cash: immediate / next release / speculative.

            ## Blockers (must fix before merge)
            Only list items that actively prevent revenue: broken build,
            failing tests, regressed UX on the explorer, security holes in
            the deploy path, or dataset contract violations. Cite file:line.

            ## Revenue upside missed
            Concrete, in-scope opportunities this PR walked past. Name the
            file and the one-line change. No speculative refactors.

            ## Non-issues
            One sentence acknowledging anything you explicitly chose NOT to
            flag (style, taste, hypothetical futures) so the author knows
            you saw it and moved on.

            Rules:
            - Be direct and professional. No hedging, no filler, no emojis.
            - If the diff is trivial and profitable, say SHIP IT in two
              sentences and stop. Speed is revenue.
            - If the diff breaks `make verify`, the browser UI, the CLI
              JSON contract, or the Vercel build, that is an automatic
              BLOCK.
            - Never request changes that do not protect or produce revenue.
          claude_args: |
            --model ${{ steps.ai.outputs.model }}
            --max-turns 8
            --allowedTools Read,Grep,Glob,Bash
