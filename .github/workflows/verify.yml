name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install browser smoke dependencies
        run: npm ci

      - name: Install Chromium for Playwright smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run JUnit suite
        run: make test

      - name: Smoke test documented CLI surface
        run: make cli-smoke

      - name: Build browser UI
        run: make ui-build

      - name: Smoke test browser UI
        run: make ui-smoke
